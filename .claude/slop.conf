# stop-slop policy for l5r4-migrator. Sourced by ~/.claude/scripts/slop-check.sh.

SCOPE="changed"

KEEP="explicitly deliberately silently automatically deterministically identically manually optionally repeatedly permanently"

# for-research/ holds verbatim copies of the upstream l5r4 system at several versions. It is
# reference material to migrate away from, never ours to rewrite, and it supplies most of the
# tree-wide count on its own.
EXTRA_EXCLUDES=(':!for-research' ':!lang' ':!packs' ':!*.min.js')
